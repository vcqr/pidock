name: CI

# 用户拍板：main 的直接 push 不跑 CI（发布以 tag 为准）；PR 和手动触发才检查
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: TS / Vue（typecheck + 构建）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 全仓 typecheck
        run: pnpm -r typecheck

      # ⚠️ 别加 @pidock/ui 的 vite build——包无 index.html，该脚本预存就是坏的；
      # ui 的真实门禁是 typecheck + 被 desktop/web 构建实际打包
      - name: 构建 web
        run: pnpm --filter @pidock/web build

  rust:
    name: Rust（fmt / clippy / test）
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # pidock-desktop 依赖 tauri，clippy 编译需要 GTK/WebKit 系统头文件
      - name: 安装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev build-essential pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      # TODO: 先清掉现存 lint（目前 14 条）后，去掉 continue-on-error 收紧为阻塞门禁
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        continue-on-error: true

      - name: cargo test（protocol crate + ts-rs 绑定导出）
        run: cargo test -p pidock-protocol

      # 绑定重新生成后必须与已提交的 packages/protocol/src 一致
      - name: 检查 TS 绑定是否有 drift
        run: git diff --exit-code -- packages/protocol/src

      # server 双管道变体都要能编译（kafka 变体由 clippy --workspace 覆盖，这里补 redis 变体）
      - name: cargo check server（Redis Streams 变体）
        run: cargo check --no-default-features -p pidock-server
