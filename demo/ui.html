<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ZCode · 界面复刻</title>
<style>
:root{
  --bg-main:#1a1a1a; --bg-side:#232323; --bg-card:#252525; --bg-elev:#2a2a2a;
  --bg-hover:#2f2f2f; --line:#343434; --line-soft:#2c2c2c;
  --t1:#ececec; --t2:#b3b3b3; --t3:#8a8a8a; --t4:#666; --accent:#e8a33d;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg-main);color:var(--t1);overflow:hidden;font-size:14px}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
svg{display:block;flex:none}
.app{display:flex;height:100vh}
.flex-sp{flex:1}

/* ============ 左栏 ============ */
.sidebar{width:260px;flex:none;background:var(--bg-side);border-right:1px solid var(--line-soft);
  display:flex;flex-direction:column}
.sb-head{display:flex;align-items:center;gap:6px;padding:14px 12px 10px}
.logo{width:28px;height:28px;border-radius:7px;background:#f2f2f2;color:#141414;font-weight:800;
  font-size:16px;display:grid;place-items:center;margin-right:4px}
.icon-btn{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--t3)}
.icon-btn:hover{background:var(--bg-hover);color:var(--t2)}
.icon-btn.disabled{opacity:.45;pointer-events:none}

.sb-nav{padding:2px 8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;
  color:#d6d6d6;cursor:pointer;margin-bottom:2px}
.nav-item:hover{background:var(--bg-hover)}
.nav-item svg{color:var(--t3)}
.nav-item .kbd{margin-left:auto;font-size:11px;color:var(--t4)}

.sb-tools{display:flex;align-items:center;gap:4px;padding:10px 12px 6px}
.seg-btn{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;
  font-size:12px;color:var(--t3);border:1px solid transparent}
.seg-btn:hover{color:var(--t2)}
.seg-btn.active{background:#1c1c1c;border-color:var(--line);color:var(--t1)}

.sb-scroll{flex:1;overflow-y:auto;padding:2px 8px 8px}
.sb-scroll::-webkit-scrollbar{width:8px}
.sb-scroll::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:4px}
.sb-title{font-size:12px;color:var(--t3);padding:12px 10px 6px}
.folder-row{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;color:#cfcfcf;cursor:pointer}
.folder-row:hover{background:var(--bg-hover)}
.folder-row svg{color:var(--t3)}
.task-row{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 34px;border-radius:8px;
  color:#bdbdbd;cursor:pointer;white-space:nowrap;overflow:hidden}
.task-row:hover{background:var(--bg-hover)}
.task-row .txt{overflow:hidden;text-overflow:ellipsis}
.task-row .time{margin-left:auto;font-size:11px;color:var(--t4);flex:none}
.show-more{padding:6px 10px 6px 34px;color:var(--t4);font-size:12px;cursor:pointer}
.show-more:hover{color:var(--t3)}
.empty{padding:2px 10px;color:var(--t4);font-size:12px}

.sb-foot{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line-soft)}
.avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#f5f5f5,#e8a33d);
  color:#a33;display:grid;place-items:center;font-size:13px;font-weight:700}
.uname{font-size:13px;color:#ddd}
.icon-btn.orange{color:var(--accent)}

/* ============ 右栏 ============ */
.main{flex:1;position:relative;display:flex;flex-direction:column;min-width:0}
.titlebar{display:flex;align-items:center;justify-content:flex-end;gap:2px;padding:10px 12px}
.titlebar .icon-btn:hover{color:var(--t1)}
.titlebar .close:hover{background:#e04444;color:#fff}

.stage{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:0 40px 60px;overflow:hidden}
.watermark{position:absolute;top:6%;left:50%;transform:translateX(-50%) skewX(-10deg);
  font-size:240px;font-weight:800;font-style:italic;line-height:1;letter-spacing:-14px;
  color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.06);user-select:none;pointer-events:none}
.greet{font-size:26px;font-weight:600;letter-spacing:1px;margin-bottom:34px}

/* 额度提示条 */
.quota{display:flex;align-items:center;gap:10px;width:min(760px,100%);
  background:var(--bg-card);border:1px solid var(--line);border-radius:12px;
  padding:9px 14px;margin-bottom:16px;color:#cfcfcf;font-size:13px}
.quota svg{color:var(--t3)}
.q-upgrade{margin-left:auto;display:flex;align-items:center;gap:8px;background:#3a3a3a;
  border-radius:999px;padding:4px 5px 4px 12px;color:#eee;font-size:13px}
.q-upgrade:hover{background:#454545}
.q-badge{background:#f2f2f2;color:#222;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}

/* 输入卡片 */
.composer{width:min(760px,100%);background:var(--bg-card);border:1px solid var(--line);
  border-radius:16px;padding:14px 16px 12px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.c-folder{display:flex;align-items:center;gap:8px;color:var(--t2);font-size:13px;margin-bottom:10px;cursor:pointer}
.c-folder:hover{color:var(--t1)}
.c-input{width:100%;min-height:56px;background:none;border:none;outline:none;resize:none;
  color:#ddd;font-size:14px;line-height:1.7;font-family:inherit}
.c-input::placeholder{color:#6f6f6f}
.c-bar{display:flex;align-items:center;gap:10px;margin-top:6px}
.plus-btn{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--t2)}
.plus-btn:hover{background:var(--bg-hover);color:var(--t1)}

/* 权限模式下拉 */
.mode-wrap{position:relative}
.mode-btn{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;
  background:var(--bg-hover);border:1px solid var(--line);color:#ddd;font-size:13px}
.mode-btn:hover{background:#343434}
.menu{position:absolute;left:0;bottom:calc(100% + 10px);width:300px;background:var(--bg-elev);
  border:1px solid var(--line);border-radius:12px;padding:6px;display:none;
  box-shadow:0 16px 40px rgba(0,0,0,.5);z-index:50}
.menu.open{display:block}
.menu-item{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
  padding:10px 12px;border-radius:8px}
.menu-item:hover{background:#333}
.mi-icon{color:#cfcfcf;margin-top:1px}
.mi-title{display:block;font-size:14px;color:var(--t1)}
.mi-desc{display:block;font-size:12px;color:var(--t3);margin-top:3px}
.mi-check{margin-left:auto;color:var(--t2);visibility:hidden;margin-top:2px}
.menu-item.active .mi-check{visibility:visible}
.menu-sep{height:1px;background:var(--line);margin:6px 4px}

.ring{width:14px;height:14px;border:2px solid #555;border-radius:50%}
.model-btn{display:flex;align-items:center;gap:6px;color:#cfcfcf;font-size:13px;padding:6px 4px;border-radius:6px}
.model-btn:hover{color:var(--t1)}
.send{width:32px;height:32px;border-radius:10px;background:#4a4a4a;color:#eee;display:grid;place-items:center}
.send:hover{background:#565656}

/* 快捷指令 chips */
.chips{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap;justify-content:center}
.chip{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:10px;
  border:1px solid var(--line);background:#222;color:#cfcfcf;font-size:13px}
.chip:hover{border-color:#4a4a4a;color:var(--t1)}
</style>
</head>

<div class="app">

      <button class="icon-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m3 0v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V7"/></svg></button>

<script>
const modeBtn=document.getElementById('modeBtn'),modeMenu=document.getElementById('modeMenu'),
      modeIcon=document.getElementById('modeIcon'),modeLabel=document.getElementById('modeLabel');
modeBtn.addEventListener('click',e=>{e.stopPropagation();modeMenu.classList.toggle('open');});
document.addEventListener('click',e=>{if(!modeMenu.contains(e.target)&&!modeBtn.contains(e.target))modeMenu.classList.remove('open');});
modeMenu.querySelectorAll('.menu-item').forEach(it=>{
  it.addEventListener('click',()=>{
    modeMenu.querySelectorAll('.menu-item').forEach(x=>x.classList.remove('active'));
    it.classList.add('active');
    modeLabel.textContent=it.dataset.mode;
    modeIcon.innerHTML=it.querySelector('.mi-icon').innerHTML;
    modeMenu.classList.remove('open');
  });
});
</script>
