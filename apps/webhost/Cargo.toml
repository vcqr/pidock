[package]
name = "pidock-webhost"
version = "0.2.3"
edition = "2021"
license = "MIT"
description = "PiDock headless web shell: serve the desktop UI over HTTP + WS IPC bridge"

[dependencies]
pidock-core = { path = "../../crates/pidock-core" }
pidock-protocol = { path = "../../crates/pidock-protocol" }
axum = { version = "0.8", features = ["ws"] }
tokio = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rust-embed = "8"
mime_guess = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
