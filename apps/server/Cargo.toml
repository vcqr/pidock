[package]
name = "pidock-server"
version = "0.5.3"
edition = "2021"
license = "MIT"
description = "PiDock server: auth, desktop WS ingest, Kafka pipeline, Mongo storage, web WS"

[dependencies]
pidock-protocol = { path = "../../crates/pidock-protocol" }
pidock-net = { path = "../../crates/pidock-net" }
axum = { version = "0.8", features = ["ws"] }
tokio = { workspace = true }
tower-http = { version = "0.6", features = ["cors", "fs"] }
rust-embed = "8"
mime_guess = "2"
bytes = "1"
toml = "0.9"
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
mongodb = "3"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
argon2 = "0.5"
jsonwebtoken = "9"
rand = "0.8"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
async-trait = "0.1"
hmac = "0.12"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# LDAP 登录：纯 Rust 实现，rustls 后端避免引入 OpenSSL
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
# 登录邮箱验证码 SMTP 发信：rustls 后端与 ldap3/reqwest 一致
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
url = "2"
# 飞书事件订阅：AES-256-CBC 解密（Encrypt Key）+ base64 事件体
base64 = "0.22"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
# 钉钉 Stream 模式：服务端作 WS 客户端长连接（与 pidock-core 的 sync-agent 同款）
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# 飞书长连接（Stream）：pbbp2.Frame protobuf 帧编解码（字段号见 im/feishu.rs）
prost = "0.13"
rdkafka = { version = "0.36", optional = true, features = ["cmake-build", "tokio"] }

[features]
default = ["kafka"]
# Kafka pipeline. `--no-default-features` swaps in the Redis Streams pipeline
# (same EventPipeline abstraction) so Windows dev builds skip cmake/librdkafka.
kafka = ["dep:rdkafka"]
