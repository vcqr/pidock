[package]
name = "pidock-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "PiDock server: auth, desktop WS ingest, Kafka pipeline, Mongo storage, web WS"

[dependencies]
pidock-protocol = { path = "../../crates/pidock-protocol" }
axum = { version = "0.8", features = ["ws"] }
tokio = { workspace = true }
tower-http = { version = "0.6", features = ["cors", "fs"] }
rust-embed = "8"
mime_guess = "2"
bytes = "1"
toml = "0.9"
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
mongodb = "3"
redis = { version = "0.27", features = ["tokio-comp"] }
argon2 = "0.5"
jsonwebtoken = "9"
rand = "0.8"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
async-trait = "0.1"
hmac = "0.12"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rdkafka = { version = "0.36", optional = true, features = ["cmake-build", "tokio"] }

[features]
default = ["kafka"]
# Kafka pipeline. `--no-default-features` swaps in the Redis Streams pipeline
# (same EventPipeline abstraction) so Windows dev builds skip cmake/librdkafka.
kafka = ["dep:rdkafka"]
