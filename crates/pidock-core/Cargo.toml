[package]
name = "pidock-core"
version = "0.5.0"
edition = "2021"
license = "MIT"
description = "PiDock runtime core: pi-host supervisor, scheduler, sync agent (UI-shell agnostic)"

[dependencies]
pidock-protocol = { path = "../pidock-protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-cron-scheduler = "0.15"
croner = "3"
# GUI 进程（尤其 macOS）环境里没有 HOSTNAME/COMPUTERNAME，取主机名要走系统调用
hostname = "0.4"

# fs_list 的盘符枚举走 GetLogicalDrives：即时返回，避免逐字母探测在断连网络盘上卡死
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }
